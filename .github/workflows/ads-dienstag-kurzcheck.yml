name: Google-Ads Dienstags-Kurzcheck

# Kampagnentabelle der letzten 7 Tage (Kosten, Klicks, Conversions,
# Auffälligkeiten ggü. Vorwoche) an den Ads-Update-Kanal. Nur lesend - siehe
# src/google_ads_client.py.
on:
  schedule:
    - cron: "0 6 * * 2"   # Dienstag, ca. 08:00 MESZ / 07:00 MEZ
  workflow_dispatch:

concurrency:
  group: ads-kanal
  cancel-in-progress: false

jobs:
  kurzcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install requests python-dotenv google-ads

      - name: Kurzcheck an den Ads-Kanal schicken
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_ADS: ${{ secrets.TELEGRAM_CHAT_ID_ADS }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: python src/main.py ads-kurzcheck
