name: Facebook-Wächter

# Sieht einmal am Tag nach, ob der Facebook-Zugang noch trägt, und meldet
# sich über Telegram, bevor ein Posttag ausfällt.
#
# Warum: Am 03.09.2026 lehnte Facebook einen Beitrag ab. Instagram lief
# weiter, der Lauf blieb grün, und der Fehler stand nur in einem Protokoll.
# Bemerkt hat es der Inhaber - Stunden später und von Hand.
#
# Der Lauf ist still, solange alles in Ordnung ist. Er schlägt an, wenn der
# Token nicht mehr gilt, ihm pages_manage_posts fehlt oder er in weniger
# als zehn Tagen abläuft.

on:
  schedule:
    # 07:10 UTC, also 09:10 deutscher Zeit - früh genug, um an einem
    # Posttag noch vor dem Beitrag zu reagieren.
    - cron: "10 7 * * *"
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhängigkeiten
        run: pip install requests

      - name: Facebook-Zugang prüfen
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          TELEGRAM_BOT_TOKEN_BERISABAUSOCIALMEDIA: ${{ secrets.TELEGRAM_BOT_TOKEN_BERISABAUSOCIALMEDIA }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py facebook-waechter
