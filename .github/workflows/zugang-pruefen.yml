name: Zugang prüfen

# Fragt Instagram, Facebook und Telegram, ob die hinterlegten Zugangsdaten
# noch gültig sind. Postet nichts. Gibt nur Meldungen aus, nie ein Token.
#
# Der Instagram-Token läuft nach 60 Tagen ab. Wenn ein Beitrag ohne
# erkennbaren Grund nicht rausgeht, ist das hier die erste Anlaufstelle.
on:
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install requests python-dotenv

      - name: Zugang abfragen
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_UEBER_SEITE: ${{ vars.IG_UEBER_SEITE }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN_BERISABAUSOCIALMEDIA: ${{ secrets.TELEGRAM_BOT_TOKEN_BERISABAUSOCIALMEDIA }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py zugang

      - name: Bildablage erreichbar?
        if: always()
        env:
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
        run: |
          # Auf ein echtes Bild prüfen, nicht auf den Ordner: GitHub Pages
          # liefert für ein Verzeichnis ohne index.html immer 404, das sagt
          # über die Erreichbarkeit nichts aus und führt in die Irre.
          DATEI=$(ls docs/posts/*.jpg 2>/dev/null | head -1)
          if [ -z "$DATEI" ]; then
            echo "Noch kein Bild in docs/posts - nichts zu prüfen."
            exit 0
          fi
          URL="$MEDIA_BASE_URL/$(basename "$DATEI")"
          CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$URL")
          echo "Bildablage antwortet mit HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Instagram könnte das Bild nicht laden (HTTP $CODE)"
            echo "Ist das Repository öffentlich? Ist GitHub Pages an? Stimmt MEDIA_BASE_URL?"
            exit 1
          fi

      - name: Führt der Seiten-Token zum Instagram-Konto?
        if: always()
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          # Der Seiten-Token laeuft nicht ab. Wenn das Instagram-Konto an der
          # Seite haengt, kann er auch Instagram bespielen - dann braucht es
          # gar kein eigenes Instagram-Token mehr.
          python - <<'PY'
          import json, os, urllib.request
          seite, token = os.environ["FB_PAGE_ID"], os.environ["FB_PAGE_TOKEN"]
          basis = "https://graph.facebook.com/v21.0"

          def hole(pfad, felder):
              url = f"{basis}/{pfad}?fields={felder}&access_token={token}"
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      return json.load(r)
              except Exception as fehler:
                  leib = getattr(fehler, "read", lambda: b"")().decode() or str(fehler)
                  return {"_fehler": leib.replace(token, "***")}

              
          antwort = hole(seite, "instagram_business_account,name")
          print("Seite:", json.dumps(antwort, ensure_ascii=False))

          konto = (antwort.get("instagram_business_account") or {}).get("id")
          if not konto:
              print("::warning::Kein Instagram-Konto an der Seite - Seiten-Token reicht nicht")
              raise SystemExit(0)

          print("Instagram-Konto-ID ueber die Seite:", konto)
          print("Konto:", json.dumps(hole(konto, "username,followers_count,media_count"), ensure_ascii=False))
          PY
