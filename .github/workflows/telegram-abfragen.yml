name: Telegram-Antworten abfragen

# Fragt alle paar Minuten ab, ob im Chat auf "Freigeben" oder "Ablehnen"
# getippt wurde. Kein Webhook, kein eigener Server nötig - GitHub-Cron
# reicht, weil der Nutzer nicht sekundengenau reagieren muss.
#
# Bei "Freigeben": Bild wird gerendert, nach docs/posts kopiert und gepusht,
# auf Erreichbarkeit geprüft (Instagram lädt das Bild selbst herunter - ohne
# öffentliche URL geht nichts) und erst danach wirklich veröffentlicht.
# Bei "Ablehnen": ein neuer Kandidat wird gerendert und erneut geschickt.
# STILLGELEGT am 01.09.2026. Der Cloudflare-Worker haelt seit dem
# 30.08. den Telegram-Webhook. Telegram laesst Webhook und getUpdates
# nicht gleichzeitig zu, deshalb lieferte jeder Lauf hier
# "Conflict: can't use getUpdates method while webhook is active" und
# holte nie wieder eine Antwort ab. Aufgefallen ist das niemandem, weil
# der Fehler abgefangen wurde und der Lauf gruen endete.
#
# Der Weg ueber den Worker ist der bessere: er antwortet in ein bis zwei
# Sekunden statt im Zehnminutentakt und stoesst freigeben.yml direkt an.
# Dieser Workflow bleibt als Notweg von Hand ausloesbar. Wer ihn wieder
# im Takt laufen lassen will, muss vorher den Webhook des Workers
# loeschen, sonst scheitert er erneut.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  abfragen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Telegram-Antworten abholen und auswerten
        env:
          TELEGRAM_BOT_TOKEN_BERISABAUSOCIALMEDIA: ${{ secrets.TELEGRAM_BOT_TOKEN_BERISABAUSOCIALMEDIA }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py telegram-abfragen

      - name: Warteschlange und Ads-Verlauf sichern
        if: always()
        run: |
          git config user.name  "berisabau-bot"
          git config user.email "actions@github.com"
          # Fehlt EINER dieser Pfade, bricht "git add" mit allen ab und
          # committet nichts - deshalb einzeln und nur, was existiert.
          for pfad in content/telegram_warteschlange.json; do
            if [ -e "$pfad" ]; then git add "$pfad"; fi
          done
          git commit -m "Telegram-Warteschlange aktualisiert" || echo "nichts zu committen"
          # Parallel laufende Workflows schieben den Remote weiter.
          # Ohne Rebase scheitert der Push und das Bild landet nie auf Pages.
          gepusht=0
          for versuch in 1 2 3 4 5; do
            if git pull --rebase --autostash -q && git push -q; then gepusht=1; break; fi
            echo "Push-Versuch $versuch fehlgeschlagen, neuer Anlauf"
            sleep $((versuch * 5))
          done
          if [ "$gepusht" != 1 ]; then
            echo "Push nicht moeglich - wird beim naechsten Lauf nachgeholt"
          fi

      - name: Freigegebene Bilder veröffentlichen
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_UEBER_SEITE: ${{ vars.IG_UEBER_SEITE }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          MAX_POSTS_24H: ${{ vars.MAX_POSTS_24H }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN_BERISABAUSOCIALMEDIA: ${{ secrets.TELEGRAM_BOT_TOKEN_BERISABAUSOCIALMEDIA }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -s out/_freigegeben.json ] || [ "$(cat out/_freigegeben.json)" = "[]" ]; then
            echo "Keine Freigaben in diesem Lauf."
            exit 0
          fi

          echo "Freigegebene Beiträge werden veröffentlicht …"
          BILDER=$(python -c "
          import json
          d = json.load(open('out/_freigegeben.json'))
          names = sorted({n for e in d for n in e['bilder']})
          print('\n'.join(names))
          ")

          mkdir -p docs/posts
          for B in $BILDER; do cp "out/$B" "docs/posts/$B"; done

          git config user.name  "berisabau-bot"
          git config user.email "actions@github.com"
          # Fehlt EINER dieser Pfade, bricht "git add" mit allen ab und
          # committet nichts - deshalb einzeln und nur, was existiert.
          for pfad in docs/posts; do
            if [ -e "$pfad" ]; then git add "$pfad"; fi
          done
          git commit -m "Freigegebene Bilder öffentlich abgelegt" || echo "nichts zu committen"
          # Parallel laufende Workflows schieben den Remote weiter.
          # Ohne Rebase scheitert der Push und das Bild landet nie auf Pages.
          gepusht=0
          for versuch in 1 2 3 4 5; do
            if git pull --rebase --autostash -q && git push -q; then gepusht=1; break; fi
            echo "Push-Versuch $versuch fehlgeschlagen, neuer Anlauf"
            sleep $((versuch * 5))
          done
          if [ "$gepusht" != 1 ]; then
            echo "::error::Push nach 5 Versuchen fehlgeschlagen"
            exit 1
          fi

          for B in $BILDER; do
            URL="$MEDIA_BASE_URL/$B"
            echo "Prüfe $URL"
            ERREICHBAR=0
            for i in $(seq 1 20); do
              CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$URL")
              if [ "$CODE" = "200" ]; then
                echo "Erreichbar nach $((i*10))s"
                ERREICHBAR=1
                break
              fi
              echo "  Versuch $i: HTTP $CODE"
              sleep 10
            done
            if [ "$ERREICHBAR" != "1" ]; then
              echo "::error::Bild ist nicht öffentlich erreichbar: $URL"
              exit 1
            fi
          done

          python src/main.py telegram-veroeffentlichen

      - name: Verlauf und Protokoll sichern
        if: always()
        run: |
          git config user.name  "berisabau-bot"
          git config user.email "actions@github.com"
          # Fehlt EINER dieser Pfade, bricht "git add" mit allen ab und
          # committet nichts - deshalb einzeln und nur, was existiert.
          for pfad in content/verlauf.json logs; do
            if [ -e "$pfad" ]; then git add "$pfad"; fi
          done
          git commit -m "Telegram-Freigabe verarbeitet" || echo "nichts zu committen"
          # Parallel laufende Workflows schieben den Remote weiter.
          # Ohne Rebase scheitert der Push und das Bild landet nie auf Pages.
          gepusht=0
          for versuch in 1 2 3 4 5; do
            if git pull --rebase --autostash -q && git push -q; then gepusht=1; break; fi
            echo "Push-Versuch $versuch fehlgeschlagen, neuer Anlauf"
            sleep $((versuch * 5))
          done
          if [ "$gepusht" != 1 ]; then
            echo "Push nicht moeglich - wird beim naechsten Lauf nachgeholt"
          fi

      - name: Ergebnis als Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-${{ github.run_number }}
          path: out/
          retention-days: 7
