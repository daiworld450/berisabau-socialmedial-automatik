name: Clip-Werk – Stream auswerten

# Holt einen Twitch-VOD, erkennt den Text und macht daraus Clip-Vorschläge.
# Ein Klick auf "Run workflow" genügt - weder Terminal noch eingerichteter
# Rechner nötig, weil die GitHub-Server den Netzzugang mitbringen.
#
# Warum über den Ton und nicht über den Chat: Twitch verlangt für Chatabrufe
# einen signierten Nachweis aus einem angemeldeten Browser. Am Runner endet
# das mit "failed integrity check". Das ist eine bewusste Schutzmaßnahme und
# wird hier nicht umgangen. Ton und Video sind davon nicht betroffen - beides
# wurde am Runner mehrfach anstandslos abgerufen.
#
# Das ist kein Verlust: mit Transkript liefert das Clip-Werk mehr als mit
# Chat - Untertitel, Zitate als Hook, Satzgrenzen und das Herausschneiden von
# Stille. Wer den Chat trotzdem einspeisen will, holt ihn angemeldet auf dem
# eigenen Rechner und übergibt die Datei mit --chat.

on:
  workflow_dispatch:
    inputs:
      vod:
        description: "Adresse des VODs, z. B. https://www.twitch.tv/videos/2862735566"
        type: string
        required: true
      streamer:
        description: "Name des Streamers (für Hashtags)"
        type: string
        default: "K1ANUSH"
      spiel:
        description: "Kategorie des Streams"
        type: string
        default: "Just Chatting"
      modell:
        description: "Spracherkennung: small ist der gute Kompromiss"
        type: choice
        options: ["tiny", "base", "small", "medium"]
        default: "small"
      schwelle:
        description: "Mindestpunktzahl, leer = 65"
        type: string
        default: ""
      diagnose:
        description: "Nur pruefen, ob der Ton erreichbar ist (nichts auswerten)"
        type: boolean
        default: false

permissions:
  contents: write

# Zwei Läufe gleichzeitig würden sich beim Schreiben der Clip-Datenbank in
# die Quere kommen.
concurrency:
  group: clip-auswerten
  cancel-in-progress: false

jobs:
  auswerten:
    runs-on: ubuntu-latest
    # Spracherkennung über einen langen Stream braucht Zeit. Großzügig
    # bemessen: lieber ein Lauf, der durchläuft, als einer, der kurz vor dem
    # Ziel abgeschnitten wird.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Werkzeuge installieren
        run: pip install --quiet yt-dlp faster-whisper

      - name: Videonummer aus der Adresse lesen
        id: vod
        run: |
          NUMMER=$(printf '%s' "${{ inputs.vod }}" \
            | sed -n 's#.*/videos/\([0-9][0-9]*\).*#\1#p')
          if [ -z "$NUMMER" ]; then
            echo "::error::Keine Videonummer in der Adresse gefunden."
            echo "Gebraucht wird eine Adresse mit /videos/ darin, also etwa"
            echo "https://www.twitch.tv/videos/2862735566 - nicht die Kanalseite."
            exit 1
          fi
          echo "nummer=$NUMMER" >> "$GITHUB_OUTPUT"
          echo "Video $NUMMER"

      - name: Ton laden
        run: |
          mkdir -p arbeit
          # Ausgabe mitschreiben: die Protokoll-Schnittstelle gibt nur das
          # Ende eines Laufs heraus, und eine Meldung aus der Mitte wäre
          # sonst nicht zu sehen. Der letzte Schritt gibt die Datei aus.
          set -o pipefail
          yt-dlp -f bestaudio --extract-audio --audio-format m4a \
            -o arbeit/ton.m4a "${{ inputs.vod }}" 2>&1 | tee -a arbeit/lauf.log
          ls -lh arbeit/ton.m4a | tee -a arbeit/lauf.log

      - name: Nur Diagnose - hier ist Schluss
        if: inputs.diagnose
        run: |
          echo "Diagnosemodus: der Ton ist da, ausgewertet wird nichts." \
            | tee -a arbeit/lauf.log

      - name: Text erkennen
        if: ${{ !inputs.diagnose }}
        run: |
          set -o pipefail
          python src/clipwerk/transkript.py arbeit/ton.m4a \
            --ziel arbeit/transkript.json \
            --modell "${{ inputs.modell }}" 2>&1 | tee -a arbeit/lauf.log

      - name: Auswerten
        if: ${{ !inputs.diagnose }}
        run: |
          if [ -n "${{ inputs.schwelle }}" ]; then
            SCHWELLE="--schwelle ${{ inputs.schwelle }}"
          else
            SCHWELLE=""
          fi
          set -o pipefail
          # shellcheck disable=SC2086
          python src/main.py clip analyse \
            --transkript arbeit/transkript.json \
            --stream-id "${{ steps.vod.outputs.nummer }}" \
            --streamer "${{ inputs.streamer }}" \
            --spiel "${{ inputs.spiel }}" \
            --ziel "docs/clips/${{ steps.vod.outputs.nummer }}" \
            --aufnehmen \
            $SCHWELLE 2>&1 | tee -a arbeit/lauf.log

      - name: Veröffentlichungsplan anhängen
        if: ${{ !inputs.diagnose }}
        run: |
          ORDNER="docs/clips/${{ steps.vod.outputs.nummer }}"
          if [ -s "$ORDNER/clips.json" ]; then
            {
              echo
              echo "---"
              echo
              echo '## Veröffentlichungsplan'
              echo
              echo '```'
              python src/main.py clip plan --clips "$ORDNER/clips.json" || true
              echo '```'
            } >> "$ORDNER/bericht.md"
          fi

      - name: Bericht ins Repo legen
        if: ${{ !inputs.diagnose }}
        run: |
          ORDNER="docs/clips/${{ steps.vod.outputs.nummer }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ORDNER" content/clip_verlauf.json
          if git diff --staged --quiet; then
            echo "Nichts Neues - der Stream wurde schon einmal ausgewertet."
          else
            git commit -m "Clip-Vorschlaege fuer Stream ${{ steps.vod.outputs.nummer }}"
            git push
          fi

      - name: Bericht und Transkript als Download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ steps.vod.outputs.nummer }}
          path: |
            docs/clips/${{ steps.vod.outputs.nummer }}/
            arbeit/transkript.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Zusammenfassung
        if: always()
        run: |
          # Zuerst das Laufprotokoll, damit es am Ende steht und ohne
          # Herunterladen des ganzen Protokolls lesbar ist.
          if [ -s arbeit/lauf.log ]; then
            echo "----- Lauf -----"
            tail -n 25 arbeit/lauf.log
            echo "----------------"
          fi
          ORDNER="docs/clips/${{ steps.vod.outputs.nummer }}"
          {
            echo "# Clip-Werk: Stream ${{ steps.vod.outputs.nummer }}"
            echo
            if [ -s "$ORDNER/bericht.md" ]; then
              echo "Der vollstaendige Bericht liegt im Repo unter"
              echo "\`$ORDNER/bericht.md\` und unten als Download."
              echo
              sed -n '1,60p' "$ORDNER/bericht.md"
            else
              echo "Es wurde kein Bericht erzeugt - siehe Protokoll oben."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
