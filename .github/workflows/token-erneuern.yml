name: Token prüfen

# Umgebaut am 01.09.2026. Was vorher hier stand, konnte nicht funktionieren:
#
#   - Der Lauf verlängerte das Secret IG_ACCESS_TOKEN über
#     graph.instagram.com/refresh_access_token. Dieses Secret existiert im
#     Repo nicht. Gepostet wird über FB_PAGE_TOKEN, weil die Variable
#     IG_UEBER_SEITE auf 1 steht und src/config.py dann umschaltet.
#   - Der Schritt, der das Ergebnis zurückschreibt, hing an einem Secret
#     GH_PAT, das ebenfalls fehlt. Er wurde also nie ausgeführt.
#   - Bei Fehlschlag legte der Lauf ein GitHub-Issue an. In dieses Repo sieht
#     im Alltag niemand.
#
# Ein Seiten-Token, der aus einem langlebigen Nutzer-Token stammt, läuft
# nicht ab. Stammt er aus einem kurzlebigen, läuft er nach rund 60 Tagen ab.
# Welcher Fall hier vorliegt, lässt sich von außen nicht sagen, deshalb misst
# dieser Lauf es und meldet das Ergebnis nach Telegram, statt eine Erneuerung
# vorzutäuschen, die es nicht gibt.

on:
  schedule:
    - cron: "30 5 1,15 * *"      # am 1. und 15. jeden Monats
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: Gültigkeit und Restlaufzeit messen
        id: pruefung
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone

          token = os.environ.get("FB_PAGE_TOKEN", "")
          if not token:
              print("lage=fehlt")
              print("text=FB_PAGE_TOKEN ist nicht gesetzt. Ohne ihn kann nichts posten.")
              raise SystemExit(0)

          def hole(pfad, **felder):
              felder["access_token"] = token
              url = f"https://graph.facebook.com/v21.0/{pfad}?{urllib.parse.urlencode(felder)}"
              with urllib.request.urlopen(url, timeout=30) as antwort:
                  return json.load(antwort)

          # Erst der praktische Test: trägt der Token noch das Konto?
          try:
              seite = hole(os.environ.get("FB_PAGE_ID", "me"), fields="id,name")
          except Exception as fehler:
              print("lage=ungueltig")
              print(f"text=Der Seiten-Token wird abgelehnt: {fehler}. "
                    "Es geht derzeit kein Beitrag raus.")
              raise SystemExit(0)

          # Dann die Restlaufzeit. debug_token liefert sie, wenn die App sie preisgibt.
          rest_tage = None
          try:
              daten = hole("debug_token", input_token=token).get("data", {})
              ablauf = daten.get("expires_at") or daten.get("data_access_expires_at") or 0
              if ablauf:
                  rest = datetime.fromtimestamp(ablauf, tz=timezone.utc) - datetime.now(timezone.utc)
                  rest_tage = rest.days
          except Exception:
              pass

          name = seite.get("name", seite.get("id", "?"))
          if rest_tage is None:
              print("lage=ok")
              print(f"text=Seiten-Token gültig für '{name}'. Kein Ablaufdatum hinterlegt, "
                    "der Token läuft also nicht ab.")
          elif rest_tage <= 14:
              print("lage=knapp")
              print(f"text=Seiten-Token für '{name}' läuft in {rest_tage} Tagen ab. "
                    "Jetzt einen neuen erzeugen, siehe docs/02-INSTAGRAM-EINRICHTEN.md, "
                    "und als Secret FB_PAGE_TOKEN hinterlegen.")
          else:
              print("lage=ok")
              print(f"text=Seiten-Token gültig für '{name}', noch {rest_tage} Tage.")
          PY

      - name: Ergebnis nach Telegram melden
        if: always()
        env:
          TELEGRAM_BOT_TOKEN_BERISABAUSOCIALMEDIA: ${{ secrets.TELEGRAM_BOT_TOKEN_BERISABAUSOCIALMEDIA }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LAGE: ${{ steps.pruefung.outputs.lage }}
          TEXT: ${{ steps.pruefung.outputs.text }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "src")
          import telegram_bot

          lage = os.environ.get("LAGE", "unklar")
          text = os.environ.get("TEXT", "Die Tokenprüfung hat kein Ergebnis geliefert.")
          zeichen = {"ok": "✅", "knapp": "⚠️", "ungueltig": "🛑", "fehlt": "🛑"}.get(lage, "❓")

          if not telegram_bot.aktiv():
              print(f"Telegram nicht eingerichtet. Ergebnis: {lage} – {text}")
              sys.exit(0)

          # Bei "ok" nur am 1. des Monats melden, sonst wird der Kanal zur Tapete.
          from datetime import date
          if lage == "ok" and date.today().day != 1:
              print(f"Alles in Ordnung ({text}). Keine Meldung nötig.")
              sys.exit(0)

          telegram_bot.sende_text(f"{zeichen} Tokenprüfung\n\n{text}")
          print("Gemeldet.")
          PY

      - name: Rot werden, wenn der Token nicht trägt
        if: steps.pruefung.outputs.lage == 'ungueltig' || steps.pruefung.outputs.lage == 'fehlt'
        run: |
          echo "::error::${{ steps.pruefung.outputs.text }}"
          exit 1
