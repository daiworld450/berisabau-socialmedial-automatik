name: Post-Vorschlag an Telegram

# Läuft gut anderthalb Stunden vor dem eigentlichen Posttermin (18:30, siehe
# taeglich-posten.yml) und schickt den nächsten Kandidaten zur Freigabe an
# Telegram. Das lässt Zeit für eine oder mehrere Ablehnungsrunden, bevor der
# planmäßige Post-Job feuert. Ohne TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID bricht
# der Schritt einfach ab - dann läuft alles wie bisher vollautomatisch über
# taeglich-posten.yml.
on:
  schedule:
    - cron: "0 15 * * *"     # 17:00 deutscher Sommerzeit
  workflow_dispatch:
    inputs:
      datum:
        description: "Abweichendes Datum (JJJJ-MM-TT), leer = heute"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  vorschlagen:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Frisch hochgeladene Fotos verarbeiten
        run: python src/main.py fotos-verarbeiten

      - name: Verarbeitete Fotos committen
        run: |
          git config user.name  "berisabau-bot"
          git config user.email "actions@github.com"
          # Fehlt EINER dieser Pfade, bricht "git add" mit allen ab und
          # committet nichts - deshalb einzeln und nur, was existiert.
          for pfad in content/medien; do
            if [ -e "$pfad" ]; then git add "$pfad"; fi
          done
          git commit -m "Fotos aus dem Eingang verarbeitet" || echo "nichts zu committen"
          # Parallel laufende Workflows schieben den Remote weiter.
          # Ohne Rebase scheitert der Push und das Bild landet nie auf Pages.
          gepusht=0
          for versuch in 1 2 3 4 5; do
            if git pull --rebase --autostash -q && git push -q; then gepusht=1; break; fi
            echo "Push-Versuch $versuch fehlgeschlagen, neuer Anlauf"
            sleep $((versuch * 5))
          done
          if [ "$gepusht" != 1 ]; then
            echo "Push nicht moeglich - wird beim naechsten Lauf nachgeholt"
          fi

      - name: Kandidat rendern und an Telegram schicken
        env:
          TELEGRAM_BOT_TOKEN_BERISABAUSOCIALMEDIA: ${{ secrets.TELEGRAM_BOT_TOKEN_BERISABAUSOCIALMEDIA }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ inputs.datum }}" ]; then
            python src/main.py vorschlagen --datum "${{ inputs.datum }}"
          else
            python src/main.py vorschlagen
          fi

      - name: Warteschlange sichern
        if: always()
        run: |
          git config user.name  "berisabau-bot"
          git config user.email "actions@github.com"
          # Fehlt EINER dieser Pfade, bricht "git add" mit allen ab und
          # committet nichts - deshalb einzeln und nur, was existiert.
          for pfad in content/telegram_warteschlange.json; do
            if [ -e "$pfad" ]; then git add "$pfad"; fi
          done
          git commit -m "Telegram-Vorschlag verschickt" || echo "nichts zu committen"
          # Parallel laufende Workflows schieben den Remote weiter.
          # Ohne Rebase scheitert der Push und das Bild landet nie auf Pages.
          gepusht=0
          for versuch in 1 2 3 4 5; do
            if git pull --rebase --autostash -q && git push -q; then gepusht=1; break; fi
            echo "Push-Versuch $versuch fehlgeschlagen, neuer Anlauf"
            sleep $((versuch * 5))
          done
          if [ "$gepusht" != 1 ]; then
            echo "Push nicht moeglich - wird beim naechsten Lauf nachgeholt"
          fi
